<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Purple Radial Backdrop -->
    <radialGradient id="bgGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="60%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e1035" />
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Outer Glow Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Container with Border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#borderGrad)" />
  <rect x="5" y="5" width="90" height="90" rx="21" fill="url(#bgGrad)" />

  <!-- Stars / Sparkles -->
  <circle cx="20" cy="22" r="2" fill="#fde047" opacity="0.9" />
  <circle cx="82" cy="78" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="80" cy="25" r="1" fill="#ffffff" opacity="0.7" />

  <!-- Crown on Queen -->
  <g fill="url(#goldGrad)">
    <path d="M24 38 L29 22 L37 30 L48 17 L50 31 L56 25 L58 38 Z" />
    <circle cx="29" cy="20" r="2.5" />
    <circle cx="48" cy="15" r="3" />
    <circle cx="56" cy="23" r="2.2" />
    <circle cx="21" cy="32" r="1.8" />
    <circle cx="36" cy="36" r="1.5" fill="#ffffff" />
    <circle cx="46" cy="36" r="1.5" fill="#ffffff" />
  </g>

  <!-- Queen Silhouette & Flowing "D" Hair Arc -->
  <g fill="url(#goldGrad)">
    <!-- Face Silhouette facing right -->
    <path d="M40 38 C47 38 56 41 58 48 C59 51 57 54 58 56 C60 58 63 59 61 62 C59 64 55 64 54 66 C52 69 49 72 46 73 C43 74 40 73 38 70 C37 65 38 60 39 56 C39 49 39 43 40 38 Z" />
    
    <!-- Outer Sweeping 'D' Loop -->
    <path d="M48 33 C70 33 86 47 86 64 C86 78 72 87 55 87 C44 87 33 84 25 77 C33 79 44 80 54 79 C68 77 77 69 77 60 C77 50 66 42 50 41 C48 38 48 35 48 33 Z" />
    
    <!-- Flowing Front Hair Curls -->
    <path d="M38 42 C34 48 28 55 25 64 C21 74 25 83 35 87 C26 84 19 76 20 66 C21 57 28 49 36 43 Z" />
    
    <!-- Lower Swirl -->
    <path d="M27 83 C38 88 54 89 66 84 C54 85 42 84 33 80 C30 79 27 81 27 83 Z" />
  </g>

  <!-- Crown Sparkle Star -->
  <path d="M48 15 Q48 18 45 18 Q48 18 48 21 Q48 18 51 18 Q48 18 48 15 Z" fill="#ffffff" />
</svg>